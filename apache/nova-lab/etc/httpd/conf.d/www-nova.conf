<VirtualHost 10.88.20.21:443>
	ServerName www.nova.test
	ServerAdmin support@nova.test
	DocumentRoot /var/www/html/nova/
	DirectoryIndex index.html
	SSLEngine on
	SSLCertificateFile /etc/pki/tls/certs/nova-test.pem
	SSLCertificateKeyFile /etc/pki/tls/private/nova-test-key.pem 
	ErrorLog /var/log/httpd/nova-error.log
	CustomLog /var/log/httpd/nova-access.log combined
</VirtualHost>


