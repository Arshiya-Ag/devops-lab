<VirtualHost 10.88.20.21:443>
	ServerName dl.nova.test
	ServerAdmin support@nova.test
	DocumentRoot /var/www/html/dl-nova
	SSLEngine on
	SSLCertificateFile /etc/pki/tls/certs/nova-test.pem
	SSLCertificateKeyFile /etc/pki/tls/private/nova-test-key.pem
	RemoteIpHeader X-Real-IP
	RemoteIpInternalProxy 10.88.20.35 10.88.20.36
	ErrorLog /var/log/httpd/dl-nova-error.log
	CustomLog /var/log/httpd/access-dl-nova.log nova_access
</VirtualHost>

<VirtualHost 10.88.20.21:80>
	ServerName dl.nova.test
	ServerAdmin support@nova.test
	Redirect permanent / https://dl.nova.test/
</VirtualHost>
