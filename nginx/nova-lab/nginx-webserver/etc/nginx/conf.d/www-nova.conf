server {
	server_name www.nova.test;
	listen 443 ssl;
	ssl_certificate /etc/pki/tls/certs/nova-test.pem;
	ssl_certificate_key /etc/pki/tls/private/nova-test-key.pem;
	root /usr/share/nginx/html/nova;
	set_real_ip_from 10.88.20.35;
	set_real_ip_from 10.88.20.36;
	real_ip_header X-Real-Ip;
	access_log /var/log/nginx/nova_access.log nova_access;

}

server {
	server_name www.nova.test;
	listen 80;
	return 301 https://www.nova.test;
}
