----
-- User configuration file for lsyncd.
--
-- Simple example for default rsync, but executing moves through on the target.
--
-- For more examples, see /usr/share/doc/lsyncd*/examples/
-- 

sync {
    default.rsync,
    source = "/etc/nginx/",
    target = "root@10.88.20.36:/etc/nginx/",
    delay = 2,
    delete = false
}

sync {
    default.rsync,
    source = "/etc/pki/tls/",
    target = "root@10.88.20.36:/etc/pki/tls/",
    delay = 2,
    delete = false
}
