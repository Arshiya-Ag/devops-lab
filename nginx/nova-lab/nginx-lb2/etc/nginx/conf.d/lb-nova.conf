upstream nova {
	server 10.88.20.22:443;
	server 10.88.20.21:443;
}

server {
	listen *:443 ssl;
	server_name www.nova.test dl.nova.test;
	ssl_certificate /etc/pki/tls/certs/nova-test.pem;
        ssl_certificate_key /etc/pki/tls/private/nova-test-key.pem;
	location / {
		proxy_pass https://nova;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Host $host;
		proxy_set_header x-Forwarded-Proto https;
		proxy_ssl_verify off;
	}
}
