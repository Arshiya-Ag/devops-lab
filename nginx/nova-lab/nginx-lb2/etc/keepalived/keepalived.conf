global_defs {
        router_id LB2
}

vrrp_scrip nginx {
        script "/usr/bin/killall -0 nginx"
        interval 2
        weight -60
}

vrrp_instance 51 {
        virtual_router_id 51
        advert_int 1
        priority 100
        state BACKUP
        interface enp0s8
        virtual_ipaddress {
                10.88.20.20/24
}

track_script {
        nginx
}
}
~          
